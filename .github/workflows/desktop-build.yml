name: Desktop build

on:
  workflow_dispatch:
  # No `paths` filter. Naming `tags` in the same push block makes branch pushes
  # stop matching, and path filters behave differently for tags than for
  # branches — the combination meant this workflow never ran at all. A full
  # build is ~5 minutes, which is not worth that fragility.
  push:
    branches:
      - main
      - openclaw
      - "claude/**"
    tags:
      - "v*"

permissions:
  contents: write

# A second push while three platform builds are still running just burns
# minutes on a result nobody will download.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-desktop.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .
      - name: Smoke-test the window
        env:
          QT_QPA_PLATFORM: offscreen
        run: python skrejper_gui.py --self-test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. An Intel build would need macos-15-intel (the
          # macos-13 image was retired in December 2025) and nobody using this
          # app is on an Intel Mac — the resulting .app will not run on one.
          - os: macos-14
            asset: Skrejper-macOS-arm64
          - os: windows-latest
            asset: Skrejper-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller==6.16.0 pillow

      - name: Build platform icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_icons.py --platform

      - name: Build app
        run: pyinstaller packaging/skrejper.spec --noconfirm

      - name: Smoke-test the built app (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/Skrejper.app/Contents/MacOS/Skrejper --self-test

      - name: Smoke-test the built app (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/Skrejper/Skrejper.exe --self-test

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto, not zip: it preserves the .app bundle's symlinks and metadata.
        run: ditto -c -k --keepParent dist/Skrejper.app ${{ matrix.asset }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Skrejper/* -DestinationPath ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}.zip
          # The builds are unsigned; say so where people download them.
          body: |
            Skrejper desktop — HZZ i Arbeitsagentur, lokalno.

            Buildovi nisu potpisani:
            - **macOS**: prvi put desni klik na aplikaciju → *Open* → *Open*.
              Ako se i dalje buni: `xattr -dr com.apple.quarantine Skrejper.app`
            - **Windows**: SmartScreen → *More info* → *Run anyway*

            Za HZZ se pri prvom pokretanju jednom preuzima Chromium (~150 MB).
            Arbeitsagentur radi odmah.
